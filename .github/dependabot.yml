version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps): "
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "vitest"
          - "vite"
          - "tsx"
          - "concurrently"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "express"
          - "react"
          - "react-dom"
          - "openai"
          - "zod"
          - "cors"
          - "express-rate-limit"
          - "multer"
          - "jszip"
          - "lucide-react"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
